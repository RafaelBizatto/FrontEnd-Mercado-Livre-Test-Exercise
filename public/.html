<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Mercado Livre</title>

</head>
<body>
    <header class="header">
        <div class="time">09:53</div>

    <div class="banner">
        <img src="../assets/banners/bannerDiadasmaes.png" alt="">

    <div class="meli-plus">Frete grátis em mais produtos por R$ 9,90</div>
    
    <nav class="menu">

    <div class="products">
        <div class="product">
            <p>Cabo De Rede Cat6</p>
            <p>R$ 78,99</p>

        <div class="product">
            <p>Roteador Dual Band Wifi</p>
            <p>R$ 255,43</p>
            <span>11% OFF</span>
        </div>

    <footer class="footer">
        <div class="footer-item">Início</div>
        <div class="footer-item">Favoritos</div>
